
services:
  webserver:
    image: nginx:1.27-bookworm
    labels:
      - "logz=${LOGZ_LABEL}"
    env_file:
      - .env
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - codebase:/var/www/html:ro
      - ./conf/nginx.conf:/etc/nginx/templates/default.conf.template
      - ./conf/ssl/nginx.crt:/etc/nginx/ssl/nginx.crt
      - ./conf/ssl/nginx.key:/etc/nginx/ssl/nginx.key
    depends_on:
      - php
    networks:
      - maho_network

  php:
    platform: linux/amd64 # fix for mac M1
    env_file:
      - .env
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.cron-default.schedule: "@every 5m"
      ofelia.job-exec.cron-default.command: "php maho cron:run default"
      ofelia.job-exec.cron-always.schedule: "@every 5m"
      ofelia.job-exec.cron-always.command: "php maho cron:run always"
      logz: ${LOGZ_LABEL}
    build:
      context: .
      dockerfile: ./docker-images/php83/Dockerfile
    volumes:
      - ./conf/php-fpm.conf:/usr/local/etc/php-fpm.d/www.conf.default.conf
      - ./conf/php-cli.conf:/usr/local/etc/php/conf.d/zzz-cli-override.ini
      - codebase:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - maho_network

  redis:
    image: redis:7-alpine
    labels:
      - "logz=${LOGZ_LABEL}"
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - maho_redis:/data
      - ./conf/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - maho_network

  db:
    image: mariadb:10.11
    labels:
      - "logz=${LOGZ_LABEL}"
    env_file:
      - .env
    volumes:
      - mahodb:/var/lib/mysql
      - ./conf/mariadb.cnf:/etc/mysql/conf.d/z.conf
    networks:
      - maho_network

  logviewer:
    image: amir20/dozzle:latest
    labels:
      - "logz=${LOGZ_LABEL}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    networks:
      - maho_network

  cron:
    image: mcuadros/ofelia:latest
    labels:
      - "logz=${LOGZ_LABEL}"
    command: daemon --docker
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  adminer:
    image: wodby/adminer
    env_file:
      - .env
    environment:
      ADMINER_DEFAULT_DB_DRIVER: mysql
      ADMINER_DEFAULT_DB_HOST: db
      ADMINER_DEFAULT_DB_NAME: ${MARIADB_DATABASE}
      ADMINER_DESIGN: nette
      ADMINER_PLUGINS: tables-filter tinymce version-noverify
    networks:
      - maho_network

  mailpit:
    image: axllent/mailpit:latest
    labels:
      - "logz=${LOGZ_LABEL}"
    environment:
      MP_SMTP_LISTEN_PORT: 1025
    networks:
      - maho_network

volumes:
  codebase:
    driver: local
  mahodb:
    driver: local
  maho_redis:
    driver: local

networks:
  maho_network:
    driver: bridge
