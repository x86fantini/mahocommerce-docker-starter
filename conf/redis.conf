# Redis configuration for Maho Commerce
# See: https://mahocommerce.com/hosting/redis/

# Persistence
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename "appendonly.aof"

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice

# Network
bind 0.0.0.0
port 6379
timeout 300
tcp-keepalive 60
